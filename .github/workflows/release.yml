name: Release Package

# Release:  tags matching 2.1.0
# Beta:     tags matching 2.1.0-beta.1, 2.1.0-preview.1, 2.1.0-rc.1, etc.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "BUILD_TYPE=Beta ($VERSION)" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "BUILD_TYPE=Release ($VERSION)" >> $GITHUB_OUTPUT
          fi

      - name: Log build type
        run: echo "Building ${{ steps.version.outputs.BUILD_TYPE }}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/HCS.Meta.Robots/HCS.Meta.Robots.csproj

      - name: Build and pack
        run: dotnet build src/HCS.Meta.Robots/HCS.Meta.Robots.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
