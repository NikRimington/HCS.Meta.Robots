name: Release Package

# Triggers on semver tags, e.g. 2.1.0
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/HCS.Meta.Robots/HCS.Meta.Robots.csproj

      - name: Build and pack
        run: dotnet build src/HCS.Meta.Robots/HCS.Meta.Robots.csproj --configuration Release --no-restore

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
